<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 사용자 목록</title>
    <!-- 프리미엄 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/css/index.css">
    <style>
        /* ...기존 스타일 유지... */
        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 탭 버튼 스타일 */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        [data-theme='light'] .tab-btn {
            background: white;
            border: 1px solid #ddd;
        }
        [data-theme='light'] .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        /* 통계 카드 스타일 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        [data-theme='light'] .stat-card {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-title {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .dashboard-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            display: none; /* 탭으로 제어 */
        }
        .dashboard-panel.active {
            display: block;
        }
        
        /* ...이하 기존 테이블, 모달 스타일 유지... */
        [data-theme='light'] .dashboard-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: var(--text-primary);
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        [data-theme='light'] th, [data-theme='light'] td {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        th {
            background: rgba(0, 0, 0, 0.2);
            font-weight: 600;
        }
        [data-theme='light'] th {
            background: rgba(0, 0, 0, 0.05);
        }

        .role-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        .role-select option {
            background: #2c2c2c;
            color: white;
        }
        [data-theme='light'] .role-select {
            background: #f0f0f0;
            border: 1px solid #ccc;
            color: #333;
        }
        [data-theme='light'] .role-select option {
            background: white;
            color: #333;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .role-admin { background: rgba(255, 71, 87, 0.2); color: #ff4757; }
        .role-user { background: rgba(46, 213, 115, 0.2); color: #2ed573; }

        .btn-danger {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-danger:hover {
            background: #ff4757;
            color: white;
        }

        .product-img-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* 모달 스타일 유지 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            color: white;
        }
        [data-theme='light'] .modal-content {
            background: white;
            color: #333;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <div class="header-top">
                <a href="/index.html" class="theme-btn" style="text-decoration:none;">← 홈으로</a>
                <h1>⚙️ 관리자 대시보드</h1>
                <div style="display: flex; gap: 10px;">
                    <button id="theme-toggle" class="theme-btn">🌙 다크 모드</button>
                    <button id="logout-btn" class="theme-btn" style="background: rgba(255, 71, 87, 0.2); color: #ff4757;">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="admin-container">
            
            <!-- 상단 통계 요약 (대시보드) -->
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-title">👥 총 가입 유저</div>
                    <div class="stat-value" id="stat-users">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">🛒 수집된 핫딜</div>
                    <div class="stat-value" id="stat-products">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">❤️ 유저 총 찜 횟수</div>
                    <div class="stat-value" id="stat-bookmarks">-</div>
                </div>
            </div>

            <!-- 탭 메뉴 -->
            <div class="admin-tabs">
                <button class="tab-btn active" data-target="panel-users">회원 관리</button>
                <button class="tab-btn" data-target="panel-products">상품 및 크롤링 관리</button>
            </div>

            <!-- 유저 관리 패널 -->
            <div id="panel-users" class="dashboard-panel active">
                <div class="panel-header">
                    <h2 class="panel-title">👥 회원 목록 (ID 관리)</h2>
                    <button id="open-create-user-modal" class="theme-btn" style="background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.4);">+ 유저 추가</button>
                </div>
                
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>가입일</th>
                            <th>권한 상태</th>
                            <th>권한 변경</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="7" style="text-align:center;">로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 상품 및 크롤링 관리 패널 -->
            <div id="panel-products" class="dashboard-panel">
                <div class="panel-header">
                    <h2 class="panel-title">📦 상품 목록 및 자동화 제어</h2>
                    <button id="trigger-crawling-btn" class="theme-btn" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; font-weight: bold;">🚀 최신 핫딜 크롤링해오기</button>
                </div>
                
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>이미지</th>
                            <th>상품명</th>
                            <th>카테고리</th>
                            <th>할인율</th>
                            <th>할인가</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody">
                        <tr><td colspan="6" style="text-align:center;">로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- 유저 생성 모달 -->
    <div id="create-user-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; font-size: 1.2rem;">새 유저 만들기</h3>
                <button id="close-create-user-modal" class="modal-close">&times;</button>
            </div>
            <form id="create-user-form">
                <div class="input-group">
                    <label>아이디 (필수)</label>
                    <input type="text" name="username" required style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group">
                    <label>비밀번호 (필수)</label>
                    <input type="password" name="password" required style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group">
                    <label>이름 (선택)</label>
                    <input type="text" name="name" style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group">
                    <label>이메일 (선택)</label>
                    <input type="email" name="email" style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group" style="margin-bottom: 20px;">
                    <label>부여할 권한</label>
                    <select name="isAdmin" class="role-select" style="width: 100%; padding: 10px;">
                        <option value="false">일반 유저 (USER)</option>
                        <option value="true">관리자 (ADMIN)</option>
                    </select>
                </div>
                <button type="submit" class="login-submit-btn" style="width: 100%;">생성하기</button>
            </form>
        </div>
    </div>
    <script src="/js/admin.js"></script>
</body>
</html>

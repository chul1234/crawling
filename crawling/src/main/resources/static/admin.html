<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 사용자 목록</title>
    <!-- 프리미엄 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/css/index.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .dashboard-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
        }

        [data-theme='light'] .dashboard-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        /* 테이블 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            color: var(--text-primary);
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        [data-theme='light'] th, [data-theme='light'] td {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            font-weight: 600;
        }

        [data-theme='light'] th {
            background: rgba(0, 0, 0, 0.05);
        }

        .role-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        
        /* 옵션(드롭다운 항목)은 OS 기본 흰색 배경이 뜰 수 있으므로 강제로 어둡게/밝게 처리 */
        .role-select option {
            background: #2c2c2c; /* 다크 모드 옵션 배경 */
            color: white; /* 다크 모드 옵션 글씨 */
        }
        
        [data-theme='light'] .role-select {
            background: #f0f0f0;
            border: 1px solid #ccc;
            color: #333;
        }

        [data-theme='light'] .role-select option {
            background: white;
            color: #333;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .role-admin {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }
        .role-user {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
        }

        /* 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            color: white;
        }
        [data-theme='light'] .modal-content {
            background: white;
            color: #333;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <div class="header-top">
                <a href="/index.html" class="theme-btn" style="text-decoration:none;">← 홈으로</a>
                <h1>⚙️ 관리자 대시보드</h1>
                <div style="display: flex; gap: 10px;">
                    <button id="theme-toggle" class="theme-btn">🌙 다크 모드</button>
                    <button id="logout-btn" class="theme-btn" style="background: rgba(255, 71, 87, 0.2); color: #ff4757;">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="admin-container">
            <div class="dashboard-panel">
                <div class="panel-header">
                    <h2 class="panel-title">👥 회원 목록 (ID 관리)</h2>
                    <button id="open-create-user-modal" class="theme-btn" style="background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.4);">+ 유저 추가</button>
                </div>
                
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>이름</th>
                            <th>이메일</th>
                            <th>가입일</th>
                            <th>권한 상태</th>
                            <th>권한 변경</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="6" style="text-align:center;">로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 유저 생성 모달 -->
    <div id="create-user-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin: 0; font-size: 1.2rem;">새 유저 만들기</h3>
                <button id="close-create-user-modal" class="modal-close">&times;</button>
            </div>
            <form id="create-user-form">
                <div class="input-group">
                    <label>아이디 (필수)</label>
                    <input type="text" name="username" required style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group">
                    <label>비밀번호 (필수)</label>
                    <input type="password" name="password" required style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group">
                    <label>이름 (선택)</label>
                    <input type="text" name="name" style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group">
                    <label>이메일 (선택)</label>
                    <input type="email" name="email" style="background: rgba(100,100,100,0.1); border: 1px solid rgba(100,100,100,0.3);">
                </div>
                <div class="input-group" style="margin-bottom: 20px;">
                    <label>부여할 권한</label>
                    <select name="isAdmin" class="role-select" style="width: 100%; padding: 10px;">
                        <option value="false">일반 유저 (USER)</option>
                        <option value="true">관리자 (ADMIN)</option>
                    </select>
                </div>
                <button type="submit" class="login-submit-btn" style="width: 100%;">생성하기</button>
            </form>
        </div>
    </div>
    <script src="/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 변동 추적</title>
    <!-- 프리미엄 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- 공통 테마(다크/라이트) 및 변수를 위해 index.css 사용 -->
    <link rel="stylesheet" href="/css/index.css"> 
    <!-- 가격 추적 전용 CSS -->
    <link rel="stylesheet" href="/css/price-history.css">
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <div class="header-top">
                <a href="/index.html" class="back-btn">⬅️ 뒤로가기</a>
                <h1>📈 가격 변동 내역</h1>
                <div class="spacer"></div> <!-- 중앙 정렬을 위한 빈 공간 -->
            </div>
        </div>
    </header>

    <main class="history-main">
        <!-- 1. 대상 상품 요약 -->
        <section class="product-summary" id="productSummary">
            <div style="text-align: center; padding: 20px;">로딩 중...</div>
        </section>

        <!-- 2. 가격 변동 리스트 카드 -->
        <section class="history-card">
            <h3>최근 수집된 가격 추이</h3>
            <ul class="price-list" id="priceList">
                <div style="text-align: center; padding: 20px;">로딩 중...</div>
            </ul>
        </section>
    </main>

    <!-- 공통 Toast 알림 스크립트 -->
    <script src="/js/toast.js"></script>
    <script src="/js/price-history.js"></script>
</body>
</html>

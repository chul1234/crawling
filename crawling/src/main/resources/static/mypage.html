<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 알짜배기 핫딜 모음</title>
    <!-- 프리미엄 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/login.css">
    <style>
        .mypage-container {
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            padding: 0 20px;
        }

        .profile-panel, .bookmarks-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            height: fit-content;
        }
        
        [data-theme='light'] .profile-panel, [data-theme='light'] .bookmarks-panel {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        [data-theme='light'] .panel-title {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .info-row {
            margin-bottom: 15px;
            color: var(--text-secondary);
        }
        
        .info-row strong {
            color: var(--text-primary);
            display: inline-block;
            width: 80px;
        }

        /* 찜 목록 그리드 오버라이드 (2단) */
        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 0;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <div class="header-top">
                <a href="/index.html" class="theme-btn" style="text-decoration:none;">← 홈으로</a>
                <h1>👤 마이페이지</h1>
                <div style="display: flex; gap: 10px;">
                    <button id="theme-toggle" class="theme-btn">🌙 다크 모드</button>
                    <button id="logout-btn" class="theme-btn" style="background: rgba(255, 71, 87, 0.2); color: #ff4757;">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="mypage-container">
            <!-- 좌측: 내 정보 관리 -->
            <aside class="profile-panel">
                <h2 class="panel-title">내 정보 관리</h2>
                
                <div id="user-info-display">
                    <div class="info-row"><strong>아이디:</strong> <span id="info-username">로딩중...</span></div>
                    <div class="info-row"><strong>가입일:</strong> <span id="info-created">로딩중...</span></div>
                </div>

                <form id="profile-update-form" style="margin-top: 30px;">
                    <div class="input-group">
                        <label for="name">이름 (실명)</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">이메일 주소</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <h3 style="margin: 20px 0 10px 0; font-size: 1.1rem; color: var(--text-primary);">비밀번호 변경 (선택)</h3>
                    <div class="input-group">
                        <label for="currentPassword">현재 비밀번호 (변경 시 필수)</label>
                        <input type="password" id="currentPassword" name="currentPassword" placeholder="기존 비밀번호">
                    </div>
                    <div class="input-group">
                        <label for="newPassword">새 비밀번호 (특수문자 포함 8자 이상)</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="새 비밀번호">
                    </div>

                    <button type="submit" class="login-submit-btn">정보 수정하기</button>
                </form>
            </aside>

            <!-- 우측: 관심 상품 (찜하기) 목록 -->
            <section class="bookmarks-panel">
                <h2 class="panel-title">❤️ 내가 찜한 핫딜</h2>
                <div id="bookmark-grid" class="bookmark-grid">
                    <div class="empty-msg">로딩 중...</div>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/mypage.js"></script>
</body>
</html>

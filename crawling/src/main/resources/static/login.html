<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 알짜배기 핫딜 모음</title>
    <!-- 프리미엄 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <!-- 상단 헤더 (글래스모피즘) -->
    <header class="glass-header">
        <div class="header-content">
            <div class="header-top">
                <div class="spacer"></div>
                <h1>🛍️ 로그인</h1>
                <button id="theme-toggle" class="theme-btn">🌙 다크 모드</button>
            </div>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container glass-panel">
            <div class="login-header">
                <h2>환영합니다</h2>
                <p>서비스 관리를 위해 로그인해 주세요.</p>
            </div>
            
            <form id="login-form" action="/api/login" method="POST">
                <div class="input-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        로그인 상태 유지
                    </label>
                </div>
                
                <button type="submit" class="login-submit-btn">로그인</button>
            </form>
            
            <div class="login-footer">
                <p>계정이 없으신가요? <a href="/signup.html">회원가입</a></p>
            </div>
        </div>
    </main>

    <script>
        // 다크 모드 토글 로직 (index.html과 동일하게 구성)
        const themeToggleBtn = document.getElementById('theme-toggle');
        
        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.innerHTML = '☀️ 라이트 모드';
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggleBtn.innerHTML = '🌙 다크 모드';
                localStorage.setItem('theme', 'light');
            }
        }

        // 초기 테마 로드
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            setTheme(true);
        } else {
            setTheme(false);
        }

        // 버튼 클릭 이벤트
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(!isDark);
        });

        // 폼 제출 데모 방지 (실제 연동 전)
        document.getElementById('login-form').addEventListener('submit', (e) => {
            // 추후 백엔드 연동 시 이 부분을 제거하거나 fetch로 변경합니다.
            // e.preventDefault();
            // console.log("Login attempted");
        });
    </script>
</body>
</html>
